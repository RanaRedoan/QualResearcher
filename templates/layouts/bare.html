{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}?v={{ ASSET_VERSION }}">
</head>
<body class="bare">
<main class="bare-main">
  <div class="side-brand bare-brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1D6B43"/><circle cx="15" cy="15" r="7" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M19.5 19.5L24 24" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span>{{ SITE_NAME }}</span>
  </div>
  {% block content %}{% endblock %}
  <p class="bare-credit">{% include "_credit.html" %}</p>
</main>
{% block scripts %}{% endblock %}
</body>
</html>
