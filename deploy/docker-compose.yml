# Public website setup for a Linux VPS:  cd deploy && docker compose up -d --build
# Fill ../.env with the APP_MODE=saas values first (see .env.example).
services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: kothon, POSTGRES_USER: kothon, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  web:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 600"
    volumes: [media:/data/private_media]
    depends_on: [db, redis]
    restart: unless-stopped
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes: [media:/data/private_media]
    depends_on: [db, redis]
    restart: unless-stopped
  beat:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    command: celery -A config beat --loglevel=info
    depends_on: [redis]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN:-localhost}"}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile, caddy_data:/data]
    depends_on: [web]
    restart: unless-stopped
volumes: {pgdata: {}, media: {}, caddy_data: {}}
